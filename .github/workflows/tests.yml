name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          # 3.9 = Apple's /usr/bin/python3, which the Dock launcher can fall back to.
          # ubuntu-latest (26.04) has no 3.9 build, so test it on 24.04.
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    env:
      TZ: Australia/Melbourne        # week boundaries and "today" match how the app is used
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=app,catalog,recurring,import_monday,demo_data \
            -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=80

      - name: Build HTML coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m coverage html -d coverage-report

      - name: Coverage summary on the run page
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 14
